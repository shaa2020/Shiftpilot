name: ShiftPilot CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: shiftpilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests (desktop + mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    name: Migrations, RLS and integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:54329/postgres
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:54329/shiftpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run test:db
      - name: Generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts

  supabase:
    name: Migrations apply on the real Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (database only) and apply migrations
        run: supabase db start
      - name: Re-apply from scratch
        run: supabase db reset --local

  e2e-supabase:
    name: Signed-in E2E on a local Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (API, Auth, Storage, DB)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - name: Export Supabase credentials
        run: |
          supabase status -o env > .supabase.env
          . ./.supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          rm .supabase.env
      - run: npm ci
      - run: npm run build
      - name: Seed demo data
        run: node scripts/seed-demo.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Signed-in flows
        run: npx playwright test -c playwright.auth.config.ts --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-auth
          path: playwright-report-auth
          retention-days: 7
